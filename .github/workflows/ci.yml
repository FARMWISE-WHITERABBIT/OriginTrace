name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: Unit Tests + Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Migration hygiene
        run: npm run check:migrations

      - name: Skills in sync (.agents -> .claude)
        run: npm run skills:check

      - name: Run tests
        run: npm test
        env:
          # Vitest needs these to exist even though they're mocked in tests
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NODE_ENV: test

  e2e-smoke:
    name: E2E Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

      - name: Start app
        run: npm start &
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          PORT: 5000

      - name: Wait for server
        run: npx wait-on http://localhost:5000 --timeout 60000

      - name: Run marketing smoke tests
        run: npx playwright test tests/e2e/marketing.spec.ts --project=chromium-public
        env:
          E2E_BASE_URL: http://localhost:5000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # db-schema-local-check
  #
  # Replays every migration in supabase/migrations/ from empty against a fresh
  # local Supabase instance (Docker, via the official CLI action — no secrets
  # involved; local instance keys are the CLI's published, non-secret
  # defaults). This catches two real things:
  #   1. A committed migration that would fail to apply cleanly (a syntax or
  #      ordering bug) — `supabase start` fails the job outright.
  #   2. lib/supabase/database.types.ts drifting from what the migrations
  #      actually produce — a developer changed schema and forgot to
  #      regenerate/commit types (or regenerated against a DB that had
  #      untracked hand-applied changes types shouldn't have reflected).
  #
  # This does NOT prove production itself matches the migrations — that needs
  # a real diff against the live DB (see db-schema-check below, which still
  # requires a human to provision a secret). This job is a strictly local,
  # secret-free complement to it, not a replacement.
  db-schema-local-check:
    name: DB Schema Check (local migration replay)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (replays supabase/migrations/ from empty)
        run: supabase start

      - name: Regenerate types from the freshly-replayed local schema
        run: supabase gen types typescript --local > /tmp/database.types.fresh.ts

      - name: Diff against committed types (ignoring the header comment block)
        run: |
          tail -n +7 lib/supabase/database.types.ts > /tmp/database.types.committed.body.ts
          if ! diff -q /tmp/database.types.committed.body.ts /tmp/database.types.fresh.ts > /dev/null; then
            echo "::error::lib/supabase/database.types.ts is stale relative to what supabase/migrations/ actually produces (excluding the header comment). A migration was added/changed without regenerating types, or types were generated against a DB with untracked schema changes."
            diff /tmp/database.types.committed.body.ts /tmp/database.types.fresh.ts || true
            exit 1
          fi
          echo "database.types.ts matches a fresh migration replay."

  # ---------------------------------------------------------------------------
  # db-schema-check (STUB — not yet active; still needs a human-provisioned secret)
  #
  # scripts/check-db.ts diffs the LIVE PRODUCTION Postgres schema (via
  # `npm run check:db`) — the check that would have caught this repo's actual
  # incident directly (a migration file existed and replayed cleanly locally,
  # but was never applied to production). db-schema-local-check above cannot
  # catch that specific case: a local replay only proves the migration *would*
  # work, not that production *has* it, and production can also have
  # untracked hand-applied changes no migration file captures. This job is
  # intentionally NOT wired up because doing so requires a new GitHub Actions
  # secret holding a live DB connection string — entering credentials into a
  # field is outside an agent's authority regardless of authorization.
  #
  # To activate, a human with repo admin access must:
  #   1. Add a repository secret named SUPABASE_DB_URL containing a Postgres
  #      connection string, e.g.
  #      postgresql://postgres:<password>@db.<project-ref>.supabase.co:5432/postgres
  #      (Settings -> Secrets and variables -> Actions -> New repository secret)
  #   2. Uncomment the job below.
  #
  # db-schema-check:
  #   name: DB Schema Check (production)
  #   runs-on: ubuntu-latest
  #   needs: test
  #
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: '22'
  #         cache: 'npm'
  #
  #     - name: Install dependencies
  #       run: npm ci
  #
  #     - name: Check live DB schema
  #       run: npm run check:db
  #       env:
  #         SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  # ---------------------------------------------------------------------------

  e2e-authenticated:
    name: E2E Authenticated (Farm/Farmer Create Flow)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (replays supabase/migrations/ from empty)
        run: supabase start

      - name: Capture local Supabase credentials
        id: supa
        run: |
          supabase status -o json > /tmp/supabase-status.json
          echo "api_url=$(node -pe 'JSON.parse(require("fs").readFileSync("/tmp/supabase-status.json","utf8")).API_URL')" >> "$GITHUB_OUTPUT"
          echo "anon_key=$(node -pe 'JSON.parse(require("fs").readFileSync("/tmp/supabase-status.json","utf8")).ANON_KEY')" >> "$GITHUB_OUTPUT"
          echo "service_role_key=$(node -pe 'JSON.parse(require("fs").readFileSync("/tmp/supabase-status.json","utf8")).SERVICE_ROLE_KEY')" >> "$GITHUB_OUTPUT"

      - name: Seed QA users + demo org data
        run: |
          npm run seed:qa
          npm run seed:qa:data
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supa.outputs.api_url }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supa.outputs.service_role_key }}

      - name: Build app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supa.outputs.api_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supa.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supa.outputs.service_role_key }}

      - name: Start app
        run: npm start &
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supa.outputs.api_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supa.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supa.outputs.service_role_key }}
          PORT: 5000

      - name: Wait for server
        run: npx wait-on http://localhost:5000 --timeout 60000

      - name: Run authenticated farm/farmer create-flow tests
        run: npx playwright test tests/e2e/farm-approval.spec.ts tests/e2e/boundary-conflicts.spec.ts --project=chromium
        env:
          E2E_BASE_URL: http://localhost:5000
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supa.outputs.api_url }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-authenticated
          path: playwright-report/
          retention-days: 7
